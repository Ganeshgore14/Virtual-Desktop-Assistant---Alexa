<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexa</title>
    <link rel="icon" type="image/png" href="Assets/img/icon1.png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!--textllate-->
    <link rel="stylesheet" href="Assets/vendor/texllate/animate.css">
</head>

<body>
    <div class="container">
        <section id="Oval" class="md-4">
            <!-- Particle.js Background -->
            <div id="particles-js">
                <div id="loader-wrapper">
                    <div class="loader-text">Alexa</div>
                    <div id="loader">
                      <div id="loader1"></div>
                    </div>
                </div>
            </div>

            <!-- Jarvis AI Heading -->
            <div class="jarvis">
                <h3 class="text-light text text-center"> Ask Me Anything</h3>
            </div>

            <!-- Input Box & Buttons -->
            <div class="col-md-12 pt-4">
                <div class="row justify-content-center">
                    <div id="textinput" class="input-group" class="d-flex">
                        <input type="text" name="chatbox" id="chatbox" placeholder=" Type Here........" autofocus>
                        <button id="SendBtn" class="glow-in-hover" style="border-radius: 8px;" hidden><i
                                class="bi bi-send"></i></button>
                        <button id="MicBtn" class="glow-in-hover" style="border-radius: 8px;"><i
                                class="bi bi-mic"></i></button>
                        <button id="chatBtn" class="glow-in-hover" data-bs-toggle="offcanvas" data-bs-target="#offcanvasScrolling" aria-controls="offcanvasScrolling"><i class="bi bi-chat-dots"></i></button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <section id="SiriWave" class="mb-4" hidden>
        <div class="container siri-wrapper">
            <div class="row">
                <div class="col-md-12">
                    <div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
                        <div class="">
                            <p class="siri-message text-center text-light">Hello, I'm alexa. How can I help you?</p>
                            <div id="siri-container"></div>
                        </div>
                    </div>
                </div>
            </div>
            <button id="homeBtn" class="glow-in-hover" style="
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                border-radius: 8px;
            ">
                <i class="bi bi-house-up-fill"></i>
            </button>
        </div>
    </section>

    <div class="offcanvas offcanvas-start chat-canvas" data-bs-scroll="true" data-bs-backdrop="false" tabindex="-1"
        id="offcanvasScrolling" aria-labelledby="offcanvasScrollingLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title text-white" id="offcanvasScrollingLabel">Chats</h5>
            <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div id="chat-canvas-body" class="offcanvas-body">
            <!-- Chatting code here -->
        </div>
    </div>

    <!-- JavaScript Dependencies -->
    <!-- jQuery (Must be included first) -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Particle.js -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <!-- SiriWave -->
    <script src="https://unpkg.com/siriwave/dist/siriwave.umd.min.js"></script>
    <!-- Textillate.js Dependencies -->
    <script src="Assets/vendor/texllate/jquery.fittext.js"></script>
    <script src="Assets/vendor/texllate/jquery.lettering.js"></script>
    <script src="https://jschr.github.io/textillate/jquery.textillate.js"></script>
    <!-- Eel -->
    <script src="/eel.js"></script>
    <!-- Application Scripts -->
    <script src="controller.js"></script>
    <script src="main.js"></script>
    <script src="script.js"></script>
</body>

</html>
